const $ = id => document.getElementById(id);
const esc = Site.esc;
const money = v => "$" + Math.round(v).toLocaleString("en-US");

function table(t, rows, port) {
  const head = `<thead><tr><th>${t.th.flight}</th><th>${t.th.dep}</th><th>${t.th.arr}</th><th class="r">${t.th.price}</th><th>${t.th.note}</th></tr></thead>`;
  const body = rows.map(r => {
    const route = port === "out" ? `${r.from} → LAS` : `LAS → ${r.to}`;
    const cls = r.st === "pick" ? "hl" : r.st === "no" ? "dim" : "";
    return `<tr class="${cls}">
      <td><span class="air">${esc(t.airline[r.al])}</span><span class="ap">${route}</span></td>
      <td class="time">${t.time(...r.dep)}</td>
      <td class="time">${t.time(...r.arr)}${r.next ? `<small>${esc(t.next)}</small>` : ""}</td>
      <td class="pr">${money(r.p)}</td>
      <td><span class="pill ${r.st}">${esc(t.st[r.st])}</span>${r.why ? `<span class="why">${esc(t.why[r.why])}</span>` : ""}</td>
    </tr>`;
  }).join("");
  return head + `<tbody>${body}</tbody>`;
}

  const route = (r, cls, priceTxt, math) => `<article class="route ${cls}">
      <div class="rk"><h3>${esc(r.name)}</h3><span class="pill ${cls === "best" ? "pick" : "na"}">${esc(r.tag)}</span></div>
      <div class="price">${priceTxt}</div>
      <div class="math">${esc(math)}</div>
      <ul>${r.pts.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
    </article>`;
  $("routes").innerHTML =
    route(t.rChi, "best c-travel", `${money(lo + BUS)}–${money(hi + BUS)}`, t.rChi.math(`${money(lo)}–${money(hi)}`)) +
    route(t.rMsn, "c-flex", `${money(MSN[0])}–${money(MSN[MSN.length - 1])}`, t.rMsn.math());
  $("out").innerHTML = table(t, OUT, "out");
  $("back").innerHTML = table(t, BACK, "back");
  $("msnfacts").innerHTML = `<span><b>${money(MSN[0])}</b>${esc(t.msnFacts[0])}</span><span>${esc(t.msnFacts[1])}</span>`;
  $("bus").innerHTML = t.bus.map(b => `<li>${esc(b)}</li>`).join("");
  $("tips").innerHTML = t.tips.map(b => `<li>${esc(b)}</li>`).join("");
}

Site.init(UI, render);
</script>
</body>
</html>

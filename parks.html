<title>Orlando Park Guide</title>

<style>
/* Layout: same system as the itinerary — a visit-order jump list, then one long section per park: photo, intro, rides beside areas/holiday/tips */
:root {
  color-scheme: light;
  --bg: #f2f4f8;
  --surface: #ffffff;
  --ink: #15213a;
  --muted: #5b6678;
  --line: #dce1ea;
  --accent: #e2622a;
  --disney: #2c5bcc;
  --universal: #7b3dc2;
  --space: #e2622a;
  --rest: #2f8a58;
  --thrill: #c2412b;
  --moderate: #b8860b;
  --gentle: #2f8a58;
  --display: "Bricolage Grotesque", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131e; --surface: #161d2c; --ink: #e8ecf3; --muted: #9ba5b7; --line: #263048; --accent: #ff8a52;
    --disney: #7fa3ff; --universal: #bb8ef2; --space: #ff8a52; --rest: #6cc795;
    --thrill: #ff7d66; --moderate: #f0c45a; --gentle: #6cc795;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131e; --surface: #161d2c; --ink: #e8ecf3; --muted: #9ba5b7; --line: #263048; --accent: #ff8a52;
  --disney: #7fa3ff; --universal: #bb8ef2; --space: #ff8a52; --rest: #6cc795;
  --thrill: #ff7d66; --moderate: #f0c45a; --gentle: #6cc795;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
[hidden] { display: none !important; }
a { color: inherit; }
.wrap {
  max-width: 940px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: flex; flex-direction: column; gap: 36px;
}
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; margin: 0; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.pnav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pnav a { font: 600 14px var(--body); color: var(--muted); text-decoration: none; padding: 8px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.pnav a:hover { color: var(--ink); }
.pnav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

header { display: flex; flex-direction: column; gap: 12px; }
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.lang { appearance: none; cursor: pointer; font: 600 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; }
h1 { font-size: clamp(32px, 6.5vw, 52px); font-weight: 800; line-height: 1.04; letter-spacing: -.02em; }
.lede { max-width: 64ch; color: var(--muted); margin: 0; }

/* Jump list */
.jump { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.jump a { display: flex; flex-direction: column; gap: 1px; text-decoration: none; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); border-left: 4px solid var(--c); }
.jump a:hover { border-color: var(--c); }
.jump .d { font-family: var(--mono); font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }
.jump .n { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Park sections */
.parks { display: flex; flex-direction: column; gap: 56px; }
.park { display: flex; flex-direction: column; gap: 18px; scroll-margin-top: 16px; }
.park + .park { border-top: 1px solid var(--line); padding-top: 48px; }
.photo { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.photo .frame { position: relative; aspect-ratio: 16 / 7; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--c); }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.photo .ph { display: none; position: absolute; inset: 0; align-items: flex-end; padding: 18px; color: #fff; font-family: var(--display); font-weight: 800; font-size: clamp(26px, 5vw, 44px); line-height: 1; letter-spacing: -.02em; }
.photo.noimg img { display: none; }
.photo.noimg .ph { display: flex; }
.photo figcaption { font-size: 12px; color: var(--muted); }
.photo figcaption a { color: var(--muted); }
.phead { display: flex; flex-direction: column; gap: 6px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.tag { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; border: 1px solid currentColor; color: var(--c); }
.day { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.park h2 { font-size: clamp(26px, 4.4vw, 36px); font-weight: 800; letter-spacing: -.015em; line-height: 1.1; }
.tagline { font-size: 17px; color: var(--muted); margin: 0; max-width: 60ch; }
.about { margin: 0; max-width: 68ch; }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
h3 { font-size: 16px; font-weight: 800; letter-spacing: 0; }
.rides { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rides li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.rides li:last-child { border-bottom: 1px solid var(--line); }
.rides .rn { font-weight: 600; }
.rides .rd { grid-column: 1 / -1; font-size: 13.5px; color: var(--muted); }
.lvl { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; align-self: start; padding: 1px 7px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
.lvl.thrill { color: var(--thrill); } .lvl.moderate { color: var(--moderate); } .lvl.gentle { color: var(--gentle); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.box section { display: flex; flex-direction: column; gap: 6px; }
.box ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.box p { margin: 0; font-size: 14px; }
.areas { display: flex; flex-wrap: wrap; gap: 6px; }
.areas span { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.official { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--c); border: 1px solid var(--c); border-radius: 999px; padding: 6px 14px; }
.official:hover { background: var(--c); color: var(--surface); }
.extras { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.extras .box h3 a { text-decoration: none; }
.extras .box h3 a:hover { text-decoration: underline; }
footer { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; max-width: 76ch; }
.top { font-size: 13px; color: var(--muted); align-self: flex-start; }
@media (max-width: 760px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .photo .frame { aspect-ratio: 4 / 3; }
}
:lang(zh) h1, :lang(zh) .park h2 { letter-spacing: 0; }
</style>
</head>

    zh:{ day:"12月24日 周四 · 平安夜", name:"EPCOT", tagline:"有过山车的世博会，也是迪士尼世界美食最好的园区。",

        ["The Twilight Zone Tower of Terror","thrill","A haunted-hotel elevator that drops (and launches up) 13 stories in random patterns."],
        ["Rock ’n’ Roller Coaster Starring the Muppets","thrill","An indoor launch coaster (0 to about 57 mph in under 3 seconds) with inversions; rethemed to the Muppets in 2026."],
        ["Millennium Falcon: Smugglers Run","moderate","You actually fly the Falcon in a 6-person cockpit — pilots, gunners and engineers. New missions added in 2026."],
        ["Slinky Dog Dash","moderate","A family launch coaster through Toy Story Land. Fun, not scary, always a long line."],
        ["Mickey & Minnie’s Runaway Railway","gentle","A trackless ride “inside” a Mickey cartoon. Clever effects."],
      ],
      areas:["Hollywood Boulevard","Sunset Boulevard","Echo Lake","Star Wars: Galaxy’s Edge","Toy Story Land","Grand Avenue","Animation Courtyard"],
      holiday:"Sunset Boulevard and Hollywood Boulevard get big holiday decorations. Disney Jollywood Nights is a separate-ticket evening party on select nights.",
      tips:["Pick one ride to rope-drop (Slinky Dog or Tower of Terror) and buy the Single Pass for Rise of the Resistance.","Try blue or green milk at Galaxy’s Edge and walk through Batuu after dark.","Fantasmic! (nighttime water and fire show) is worth staying for if it’s scheduled."] },
    zh:{ day:"12月27日 周日", name:"迪士尼好莱坞影城", tagline:"星球大战、玩具总动员，以及迪士尼园区里最多的刺激项目。",
      about:"好莱坞影城以电影和老好莱坞为主题，对你们这群人来说可能是最好玩的迪士尼日。星球大战：银河边缘是巴图星球上的实景前哨站，你可以驾驶千年隼，还会被第一秩序“抓捕”。日落大道有迪士尼最刺激的两个项目，玩具总动员乐园则把你缩小成玩具大小。园区比较小，排队很长——一天围绕几个大项目来安排。",
      rides:[
        ["星球大战：抵抗军崛起","thrill","15–20分钟、分好几段的体验：搭乘穿梭机、从歼星舰里逃脱（有真实尺寸的AT-AT步行机），再坐无轨车。普遍被认为是迪士尼世界最好的项目。需单独购买单次闪电通道，值得。"],
        ["阴阳魔界恐怖塔","thrill","闹鬼酒店里的电梯，以随机方式坠落（和弹升）13层。"],
        ["布偶摇滚过山车","thrill","室内弹射过山车（不到3秒加速到约92公里/小时），有翻转；2026年改为布偶主题。"],
        ["千年隼：走私者大冒险","moderate","在6人驾驶舱里真正驾驶千年隼——飞行员、炮手和工程师。2026年新增任务。"],
        ["抱抱龙冲天赛车","moderate","穿越玩具总动员乐园的家庭弹射过山车。好玩不吓人，永远排长队。"],
        ["米奇和米妮的失控列车","gentle","“进入”米奇动画片的无轨游乐项目，特效很巧妙。"],
      ],
      areas:["好莱坞大道","日落大道","回声湖","星球大战：银河边缘","玩具总动员乐园","格兰德大道","动画庭院"],
      holiday:"日落大道和好莱坞大道有盛大的节日装饰。Disney Jollywood Nights是部分夜晚单独售票的派对。",
      tips:["开园挑一个项目冲（抱抱龙或恐怖塔），抵抗军崛起买单次闪电通道。","在银河边缘尝尝蓝奶或绿奶，天黑后再逛一圈巴图。","如果当天有《幻想曲》（Fantasmic!，夜间水火表演），值得留下来看。"] } },

  { id:"ksc", resort:"space", date:"dec28",
    img:"8/88/Atlantis_Kennedy_Space_Center_Visitor_Complex_4.jpg/960px-Atlantis_Kennedy_Space_Center_Visitor_Complex_4.jpg", pos:"center 45%",
    credit:{ by:"Gzzz", lic:"CC BY-SA 4.0", licUrl:"https://creativecommons.org/licenses/by-sa/4.0", page:"https://commons.wikimedia.org/wiki/File:Atlantis_Kennedy_Space_Center_Visitor_Complex_4.jpg" },
    link:"https://www.kennedyspacecenter.com/",
    en:{ day:"Mon, Dec 28 · ~1 hour east", name:"Kennedy Space Center Visitor Complex", tagline:"Real rockets, a real space shuttle, and launch pads that are still in use.",
      about:"This is NASA’s spaceport on Merritt Island, where Apollo, the Space Shuttle and today’s SpaceX and Artemis rockets launch. The visitor complex is part museum, part attraction. The two things you can’t see anywhere else: Space Shuttle Atlantis, displayed as if it’s still in orbit with its payload doors open, and a complete Saturn V moon rocket lying on its side in a hall longer than a football field. Plan a full day; the bus tour alone takes about two hours.",
      rides:[
        ["Space Shuttle Atlantis","gentle","The real orbiter, plus the Shuttle Launch Experience — a motion simulator of the 8-minute ride to orbit."],
        ["KSC Bus Tour → Apollo/Saturn V Center","gentle","Drives past the Vehicle Assembly Building and launch pads to the Saturn V hall and a recreation of the Apollo 8 launch control room."],
        ["Gateway: The Deep Space Launch Complex","moderate","Spaceport KSC simulators that “fly” you to other planets, plus current spacecraft on display."],
        ["Rocket Garden","gentle","Real Mercury, Gemini and Apollo-era rockets you can walk between."],
        ["Heroes & Legends","gentle","The U.S. Astronaut Hall of Fame."],
      ],
      areas:["Main visitor complex","Space Shuttle Atlantis","Apollo/Saturn V Center (by bus)","Gateway"],
      holiday:"“Holidays in Space” runs in late December (last year Dec 21–30) with decorations and a projection show on the Gateway building. Closed on Christmas Day.",
      tips:["Arrive near the 9 a.m. opening and take the bus tour first; the last bus leaves 2.5 hours before closing.","Check the launch calendar 1–2 weeks out — if a launch falls on a trip day, move this day to match.","Buy tickets at kennedyspacecenter.com; launch-viewing add-ons are only sold there."] },
    zh:{ day:"12月28日 周一 · 向东约1小时车程", name:"肯尼迪航天中心游客中心", tagline:"真正的火箭、真正的航天飞机，还有至今仍在使用的发射台。",
      about:"这里是NASA位于梅里特岛的航天港，阿波罗、航天飞机以及如今的SpaceX和阿尔忒弥斯火箭都从这里发射。游客中心一半是博物馆，一半是景点。有两样东西别处看不到：亚特兰蒂斯号航天飞机，展示成仍在轨道上、货舱门打开的样子；以及一枚完整的土星五号登月火箭，横放在一个比足球场还长的展厅里。留出一整天；光巴士之旅就要大约两小时。",
      rides:[
        ["亚特兰蒂斯号航天飞机","gentle","真正的轨道器，还有航天飞机发射体验——模拟8分钟升空入轨的动感模拟器。"],
        ["航天中心巴士之旅 → 阿波罗/土星五号中心","gentle","途经飞行器装配大楼和发射台，到达土星五号展厅和复原的阿波罗8号发射控制室。"],
        ["Gateway：深空发射中心","moderate","Spaceport KSC模拟器带你“飞往”其他星球，还有现役航天器展示。"],
        ["火箭花园","gentle","真实的水星、双子星和阿波罗时代火箭，可以在其间漫步。"],
        ["英雄与传奇","gentle","美国宇航员名人堂。"],
      ],
      areas:["主游客中心","亚特兰蒂斯号航天飞机","阿波罗/土星五号中心（乘巴士）","Gateway"],
      holiday:"12月下旬有“太空中的节日”活动（去年12月21–30日），有装饰和在Gateway大楼上的投影秀。圣诞节当天闭馆。",
      tips:["9点开门时到，先坐巴士之旅；末班车在闭馆前2.5小时发车。","提前1–2周查看发射时间表——如果有发射在行程中的某天，就把这天调过去。","在官网kennedyspacecenter.com买票；观看发射的加购只在官网卖。"] } },

  { id:"ioa", resort:"universal", date:"dec29",
    img:"c/c4/Wizarding_World_of_Harry_Potter_Castle.jpg/960px-Wizarding_World_of_Harry_Potter_Castle.jpg", pos:"center 40%",
    credit:{ by:"Carlos Cruz", lic:"CC BY-SA 3.0", licUrl:"https://creativecommons.org/licenses/by-sa/3.0", page:"https://commons.wikimedia.org/wiki/File:Wizarding_World_of_Harry_Potter_Castle.jpg" },
    link:"https://www.universalorlando.com/web/en/us/theme-parks/islands-of-adventure",
    en:{ day:"Tue, Dec 29 · with Universal Studios", name:"Universal Islands of Adventure", tagline:"The best roller coasters in Orlando, and Hogwarts.",
      about:"Islands of Adventure is a ring of themed “islands” around a lake: Marvel superheroes, Jurassic Park, Dr. Seuss, King Kong and, at the back, Hogsmeade village with Hogwarts castle on the hill. If your group likes coasters, this is the park — VelociCoaster and Hagrid’s are two of the best in the country. You’ll split this day with Universal Studios next door, so the Hogwarts Express is how you get between the two.",
      rides:[
        ["Jurassic World VelociCoaster","thrill","Two launches up to 70 mph, a 155-foot top hat and a zero-g stall over the lagoon. Many call it the best coaster in Florida."],
        ["Hagrid’s Magical Creatures Motorbike Adventure","thrill","A story coaster on a motorbike or sidecar through the Forbidden Forest, with seven launches and a backward drop. Lines are the longest in the park — go first thing."],
        ["Harry Potter and the Forbidden Journey","moderate","Inside Hogwarts castle: a robotic-arm ride that flies you through a Quidditch match and past dragons and Dementors. The queue through the castle is half the fun."],
        ["Hogwarts Express (Hogsmeade station)","gentle","A real train to King’s Cross in Universal Studios, with a moving story in the compartment windows. Needs a park-to-park ticket."],
        ["The Incredible Hulk Coaster","thrill","A green launch coaster out of a tunnel with seven inversions."],
        ["The Amazing Adventures of Spider-Man","moderate","A 3D dark ride classic that still holds up."],
        ["Jurassic Park River Adventure","moderate","A boat ride that ends with a T. rex and an 85-foot drop. You will get wet."],
      ],
      areas:["Port of Entry","Marvel Super Hero Island","Toon Lagoon","Skull Island","Jurassic Park","The Wizarding World of Harry Potter – Hogsmeade","The Lost Continent","Seuss Landing"],
      holiday:"Christmas in the Wizarding World: Hogsmeade covered in snow-dusted decorations, and “The Magic of Christmas at Hogwarts Castle” light and projection show at night. Grinchmas and the Who-liday Spectacular in Seuss Landing.",
      tips:["Start here at opening: Hagrid’s first, then VelociCoaster.","Take the Hogwarts Express to Universal Studios around midday, and come back for the castle projection show after dark.","Hulk and VelociCoaster require bags in free lockers — keep loose items to a minimum."] },
    zh:{ day:"12月29日 周二 · 与环球影城同一天", name:"环球冒险岛", tagline:"奥兰多最好的过山车，还有霍格沃茨。",
      about:"冒险岛是围绕一片湖的一圈主题“岛屿”：漫威超级英雄、侏罗纪公园、苏斯博士、金刚，最里面是霍格莫德村，山上就是霍格沃茨城堡。如果你们喜欢过山车，这就是你们的园区——迅猛龙过山车和海格的魔法生物摩托车是全美最好的两个。这天要和隔壁的环球影城分着玩，往返两园就靠霍格沃茨特快。",
      rides:[
        ["侏罗纪世界迅猛龙过山车","thrill","两次弹射，最高约113公里/小时，47米高的礼帽形轨道，还有湖面上方的零重力翻转。很多人认为是佛州最好的过山车。"],
        ["海格的魔法生物摩托车大冒险","thrill","骑摩托车或坐边车穿越禁林的剧情过山车，有七次弹射和一次倒退坠落。园区里排队最久——开门第一时间去。"],
        ["哈利·波特禁忌之旅","moderate","在霍格沃茨城堡里：机械臂座椅带你飞越魁地奇比赛，躲开火龙和摄魂怪。穿过城堡的排队通道本身就很好看。"],
        ["霍格沃茨特快（霍格莫德站）","gentle","开往环球影城国王十字车站的真火车，车厢窗外有动态剧情。需要园区互通票。"],
        ["绿巨人过山车","thrill","从隧道里弹射出发的绿色过山车，有七次翻转。"],
        ["蜘蛛侠惊险历险记","moderate","经典3D黑暗骑乘，至今依然好玩。"],
        ["侏罗纪公园河流探险","moderate","以霸王龙和26米落差俯冲结尾的游船。一定会湿。"],
      ],
      areas:["港口入口","漫威超级英雄岛","卡通环礁湖","骷髅岛","侏罗纪公园","哈利·波特魔法世界——霍格莫德村","失落大陆","苏斯登陆区"],
      holiday:"魔法世界的圣诞：霍格莫德村挂满带雪的装饰，晚上有《霍格沃茨城堡的圣诞魔法》灯光投影秀。苏斯登陆区有格林奇圣诞活动和Who-liday歌舞秀。",
      tips:["开园先来这里：先海格，再迅猛龙。","中午前后坐霍格沃茨特快去环球影城，天黑后再回来看城堡投影秀。","绿巨人和迅猛龙要求把包存进免费储物柜——随身物品越少越好。"] } },

  { id:"usf", resort:"universal", date:"dec29",
    img:"4/4f/Diagon_Alley_%2829464712928%29.jpg/960px-Diagon_Alley_%2829464712928%29.jpg", pos:"center 45%",
    credit:{ by:"HarshLight", lic:"CC BY 2.0", licUrl:"https://creativecommons.org/licenses/by/2.0", page:"https://commons.wikimedia.org/wiki/File:Diagon_Alley_(29464712928).jpg" },
    link:"https://www.universalorlando.com/web/en/us/theme-parks/universal-studios-florida",
    en:{ day:"Tue, Dec 29 · with Islands of Adventure", name:"Universal Studios Florida", tagline:"Diagon Alley, a fire-breathing dragon, and movie-themed rides.",
      about:"Universal Studios is laid out like a film backlot — New York streets, San Francisco’s waterfront, Springfield from The Simpsons. Its highlight is Diagon Alley, hidden behind a London street front: walk through the brick wall and there’s a full wizarding street with Gringotts bank and a dragon on top that breathes real fire every few minutes. A lot of the rest overlaps with Universal Studios Hollywood, which you’ve already done, so spend your time on Diagon Alley and the rides you haven’t tried.",
      rides:[
        ["Harry Potter and the Escape from Gringotts","moderate","A 3D coaster/dark ride hybrid through the bank vaults, with Voldemort and Bellatrix. The marble-hall queue is stunning."],
        ["Hogwarts Express (King’s Cross station)","gentle","Walk through Platform 9¾ and ride to Hogsmeade. The story is different in each direction, so ride both ways."],
        ["Hollywood Rip Ride Rockit","thrill","A 17-story vertical-lift coaster where you pick your own soundtrack."],
        ["Revenge of the Mummy","thrill","An indoor launch coaster with fire effects and a backward section."],
        ["MEN IN BLACK Alien Attack","moderate","A competitive shooting dark ride — your score is shown at the end."],
        ["Transformers: The Ride-3D","moderate","Very similar to Hollywood’s version; skip if lines are long."],
      ],
      areas:["Production Central","New York","San Francisco","The Wizarding World of Harry Potter – Diagon Alley","World Expo","Springfield","Minion Land","Hollywood"],
      holiday:"Universal’s Holiday Parade featuring Macy’s (giant balloons in the afternoon), Christmas in Diagon Alley, and The Grinch-themed fun around the park. Universal’s holiday season runs through Jan 3.",
      tips:["Arrive by Hogwarts Express from Islands of Adventure, ride Gringotts, then explore Knockturn Alley.","Watch the dragon breathe fire from the middle of Diagon Alley — it happens every 10–20 minutes.","Butterbeer is sold in both Harry Potter areas; the frozen version is the favorite."] },
    zh:{ day:"12月29日 周二 · 与冒险岛同一天", name:"环球影城（佛罗里达）", tagline:"对角巷、会喷火的巨龙，还有电影主题项目。",
      about:"环球影城布置得像电影外景地——纽约街道、旧金山海滨、辛普森一家的春田镇。最大的亮点是藏在伦敦街景后面的对角巷：穿过砖墙，是一整条巫师街道，古灵阁银行屋顶上的巨龙每隔几分钟会喷出真火。园区其他部分和你去过的好莱坞环球影城有不少重复，所以把时间花在对角巷和你没玩过的项目上。",
      rides:[
        ["哈利·波特：逃离古灵阁","moderate","穿越银行金库的3D过山车/黑暗骑乘混合项目，有伏地魔和贝拉特里克斯。大理石大厅的排队区非常壮观。"],
        ["霍格沃茨特快（国王十字站）","gentle","穿过9¾站台，坐车去霍格莫德。两个方向的剧情不一样，往返都坐。"],
        ["好莱坞摇滚过山车","thrill","垂直爬升17层楼高的过山车，可以自己挑背景音乐。"],
        ["木乃伊复仇记","thrill","室内弹射过山车，有火焰特效和倒退段。"],
        ["黑衣人：外星人攻击","moderate","射击对战型黑暗骑乘——结束时会显示你的分数。"],
        ["变形金刚3D","moderate","和好莱坞版本非常像；排队长就跳过。"],
      ],
      areas:["制片中心","纽约","旧金山","哈利·波特魔法世界——对角巷","世博区","春田镇","小黄人乐园","好莱坞"],
      holiday:"梅西百货节日大游行（下午有巨型气球）、对角巷的圣诞，以及园区各处的格林奇主题活动。环球的节日季持续到1月3日。",
      tips:["从冒险岛坐霍格沃茨特快过来，先玩古灵阁，再逛翻倒巷。","站在对角巷中间看巨龙喷火——每10–20分钟一次。","两个哈利·波特园区都有黄油啤酒，冰沙版最受欢迎。"] } },

  { id:"mk", resort:"disney", date:"dec30",
    img:"8/84/Cinderella_Castle.jpg/960px-Cinderella_Castle.jpg", pos:"center 30%",
    credit:{ by:"Katie Rommel-Esham", lic:"CC BY-SA 4.0", licUrl:"https://creativecommons.org/licenses/by-sa/4.0", page:"https://commons.wikimedia.org/wiki/File:Cinderella_Castle.jpg" },
    link:"https://disneyworld.disney.go.com/destinations/magic-kingdom/",
    en:{ day:"Wed, Dec 30 · New Year’s fireworks, one night early", name:"Magic Kingdom", tagline:"The classic: Cinderella Castle, Space Mountain and the biggest fireworks of the year.",
      about:"Magic Kingdom is the original Disney World park and the most crowded. Main Street, U.S.A. leads to Cinderella Castle, with six themed lands around it. It’s often thought of as a kids’ park, but it has a solid set of coasters — TRON, Space Mountain, Big Thunder and Seven Dwarfs — plus classics like Haunted Mansion and Pirates of the Caribbean. On Dec 30 and 31 the regular fireworks are replaced by Fantasy in the Sky, the New Year’s Eve show.",
      rides:[
        ["TRON Lightcycle / Run","thrill","You lean forward on a motorbike-style seat and launch out under a glowing canopy, then race through the Grid indoors. The fastest ride at Magic Kingdom. Sold as a Single Pass."],
        ["Space Mountain","thrill","A dark indoor coaster through “outer space.” Not fast, but the darkness makes it feel wild."],
        ["Big Thunder Mountain Railroad","moderate","A runaway mine train through the desert. Reopened in 2026 after a long refurbishment with new effects."],
        ["Seven Dwarfs Mine Train","moderate","A swinging family coaster through the diamond mine. Short; sold as a Single Pass."],
        ["Tiana’s Bayou Adventure","moderate","A log flume through the Louisiana bayou with a 50-foot drop (replaced Splash Mountain)."],
        ["Haunted Mansion","gentle","The classic ghost ride. Great effects, short line in the evening."],
        ["Pirates of the Caribbean","gentle","A boat ride through a pirate raid on a Caribbean town."],
        ["Jingle Cruise","gentle","The Jungle Cruise with Christmas jokes; skippers make it funny."],
      ],
      areas:["Main Street, U.S.A.","Adventureland","Frontierland","Liberty Square","Fantasyland","Tomorrowland"],
      holiday:"The castle is covered in holiday lights, Main Street has a giant tree, and the Jungle Cruise becomes the Jingle Cruise. On Dec 30 and 31 Fantasy in the Sky fireworks run twice (last year 7:30 and 11:50 p.m.).",
      tips:["Book Lightning Lanes for this day the moment your window opens — it’s the busiest Disney day of your trip.","Do TRON and Seven Dwarfs with Single Passes and rope-drop Big Thunder or Tiana’s.","For the fireworks, pick a spot on Main Street or near the castle hub at least 45 minutes before showtime.","Getting out after the late show takes a long time; Disney’s monorail and ferry lines are huge."] },
    zh:{ day:"12月30日 周三 · 提前一晚看跨年烟花", name:"魔法王国", tagline:"经典之选：灰姑娘城堡、太空山，还有一年中最盛大的烟花。",
      about:"魔法王国是迪士尼世界最早的园区，也是人最多的。美国小镇大街通往灰姑娘城堡，周围有六个主题园区。很多人觉得它是儿童乐园，但它的过山车阵容很扎实——创极速光轮、太空山、巨雷山和七个小矮人矿山车——还有幽灵公馆和加勒比海盗等经典项目。12月30日和31日，平时的烟花换成跨年夜专场《天空幻想》。",
      rides:[
        ["创极速光轮（TRON）","thrill","趴在摩托车式座椅上，从发光的顶棚下弹射出发，再冲进室内的“网格”。魔法王国最快的项目。需单独购买单次闪电通道。"],
        ["太空山","thrill","室内黑暗过山车，穿越“外太空”。速度不快，但黑暗让它感觉很狂野。"],
        ["巨雷山铁路","moderate","穿越沙漠的失控矿车。经过长期翻新，2026年重新开放，有新特效。"],
        ["七个小矮人矿山车","moderate","穿过钻石矿的摇摆式家庭过山车。时间短；需单独购买单次闪电通道。"],

const LANG_KEY = "orlando-trip-lang";
let lang = "en";
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function detectLang() {
  if (location.hash === "#zh" || location.hash === "#en") {
    const l = location.hash.slice(1);
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    return l;
  }
  try { const s = localStorage.getItem(LANG_KEY); if (s === "zh" || s === "en") return s; } catch (e) {}
  const langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
  return langs.some(l => /^zh\b/i.test(l)) ? "zh" : "en";
}

function render() {
  const t = UI[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = t.docTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t[el.dataset.i18nAria]));
  const tog = document.getElementById("lang-toggle");
  tog.textContent = t.toggle; tog.setAttribute("aria-label", t.toggleAria);
  document.getElementById("nav-itin").href = "index.html#" + lang;
  document.getElementById("nav-parks").href = "parks.html#" + lang;
  document.getElementById("nav-launch").href = "launches.html#" + lang;
  document.getElementById("nav-budget").href = "budget.html#" + lang;

  document.getElementById("jump").innerHTML = PARKS.map(p => {
    const c = p[lang];
    return `<li><a href="#${p.id}" style="--c:var(--${p.resort})"><span class="d">${esc(c.day.split(" · ")[0])}</span><span class="n">${esc(c.name)}</span></a></li>`;
  }).join("");

  document.getElementById("parks").innerHTML = PARKS.map(p => {
    const c = p[lang];
    return `
    <article class="park" id="${p.id}" style="--c:var(--${p.resort})" aria-labelledby="${p.id}-name">
      <figure class="photo">
        <div class="frame">
          <img src="${IMG + p.img}" alt="${esc(c.name)}" loading="lazy" style="object-position:${p.pos}" onerror="this.closest('figure').classList.add('noimg')">
          <div class="ph" aria-hidden="true">${esc(c.name)}</div>
        </div>
        <figcaption>${t.photo}: <a href="${p.credit.page}" target="_blank" rel="noopener">${esc(p.credit.by)}</a>, <a href="${p.credit.licUrl}" target="_blank" rel="noopener">${p.credit.lic}</a>, via Wikimedia Commons</figcaption>
      </figure>
      <div class="phead">
        <div class="badges"><span class="tag">${t.resort[p.resort]}</span><span class="day">${esc(c.day)}</span></div>
        <h2 id="${p.id}-name">${esc(c.name)}</h2>
        <p class="tagline">${esc(c.tagline)}</p>
      </div>
      <p class="about">${esc(c.about)}</p>
      <div class="cols">
        <div class="col">
          <h3>${t.hRides}</h3>
          <ul class="rides">${c.rides.map(([n, l, d]) => `<li><span class="rn">${esc(n)}</span><span class="lvl ${l}">${t.lvl[l]}</span><span class="rd">${esc(d)}</span></li>`).join("")}</ul>
        </div>
        <div class="col">
          <div class="box">
            <section><h3>${t.hAreas}</h3><div class="areas">${c.areas.map(a => `<span>${esc(a)}</span>`).join("")}</div></section>
            <section><h3>${t.hHoliday}</h3><p>${esc(c.holiday)}</p></section>
            <section><h3>${t.hTips}</h3><ul>${c.tips.map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>
            <a class="official" href="${p.link}" target="_blank" rel="noopener">${t.official} ↗</a>
          </div>
          <a class="top" href="#top">↑ ${t.top}</a>
        </div>
      </div>
    </article>`;
  }).join("");

  document.getElementById("extras").innerHTML = EXTRAS.map(x => {
    const c = x[lang];
    return `<div class="box" style="--c:var(--rest)"><section><span class="day">${esc(c.when)}</span><h3><a href="${x.link}" target="_blank" rel="noopener">${esc(c.name)} ↗</a></h3><p>${esc(c.text)}</p></section></div>`;
  }).join("");
}

document.getElementById("lang-toggle").addEventListener("click", () => {
  lang = lang === "en" ? "zh" : "en";
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  render();
});
window.addEventListener("hashchange", () => { if (location.hash === "#zh" || location.hash === "#en") { lang = location.hash.slice(1); render(); } });

lang = detectLang();
render();
const target = location.hash.slice(1);
if (target && PARKS.some(p => p.id === target)) {
  requestAnimationFrame(() => document.getElementById(target).scrollIntoView({ block: "start" }));
}
</script>

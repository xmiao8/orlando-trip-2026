<style>
/* Layout: same system as the itinerary — live launch list for the trip window first, then a day-by-day "where you'd watch from" table, viewing spots, and how-to notes */
:root {
  color-scheme: light;
  --bg: #f2f4f8;
  --surface: #ffffff;
  --ink: #15213a;
  --muted: #5b6678;
  --line: #dce1ea;
  --accent: #e2622a;
  --go: #2f8a58;
  --tbd: #b8860b;
  --hold: #c2412b;
  --night: #2c5bcc;
  --display: "Bricolage Grotesque", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131e; --surface: #161d2c; --ink: #e8ecf3; --muted: #9ba5b7; --line: #263048; --accent: #ff8a52;
    --go: #6cc795; --tbd: #f0c45a; --hold: #ff7d66; --night: #7fa3ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131e; --surface: #161d2c; --ink: #e8ecf3; --muted: #9ba5b7; --line: #263048; --accent: #ff8a52;
  --go: #6cc795; --tbd: #f0c45a; --hold: #ff7d66; --night: #7fa3ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
[hidden] { display: none !important; }
a { color: inherit; }
.wrap {
  max-width: 900px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: flex; flex-direction: column; gap: 40px;
}
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pnav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pnav a { font: 600 14px var(--body); color: var(--muted); text-decoration: none; padding: 8px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.pnav a.tripswitch { margin-left: auto; font-weight: 500; font-size: 13px; }
.pnav a:hover { color: var(--ink); }
.pnav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
header { display: flex; flex-direction: column; gap: 12px; }
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.lang, .refresh { appearance: none; cursor: pointer; font: 600 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; }
h1 { font-size: clamp(32px, 6.5vw, 52px); font-weight: 800; line-height: 1.04; letter-spacing: -.02em; }
.lede { max-width: 64ch; color: var(--muted); margin: 0; }
section { display: flex; flex-direction: column; gap: 14px; }
h2 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.notice { font-size: 14px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 14px 16px; margin: 0; }

/* Launch cards */
.launches { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.launch { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.when { display: flex; flex-direction: column; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.when .dd { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1; color: var(--ink); margin: 2px 0; }
.when .tm { color: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
.lbody { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lbody h3 { font-size: 18px; font-weight: 600; line-height: 1.3; }
.lsub { font-size: 13.5px; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.go { color: var(--go); } .pill.tbd { color: var(--tbd); } .pill.hold { color: var(--hold); } .pill.night { color: var(--night); } .pill.plan { color: var(--accent); }
.plannote { font-size: 13.5px; border-left: 2px solid var(--accent); padding-left: 10px; }
.vague { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.vague li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.vague li:last-child { border-bottom: 1px solid var(--line); }
.vague .vt { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; align-self: start; }
.vague .vs { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }

/* Tables and spots */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
th { text-align: left; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 0 12px 8px 0; border-bottom: 1px solid var(--line); }
td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td:first-child { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; color: var(--muted); }
td b { font-weight: 600; }
.spots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.spot { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.spot h3 { font-size: 16px; font-weight: 800; }
.spot .k { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.spot p { margin: 0; font-size: 14px; }
.how { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 70ch; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { font-size: 14px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; }
.links a:hover { border-color: var(--accent); }
footer { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; max-width: 76ch; }
@media (max-width: 560px) { .launch { grid-template-columns: 70px minmax(0, 1fr); gap: 12px; } .when .dd { font-size: 26px; } }
:lang(zh) h1 { letter-spacing: 0; }
</style>
</head>

      ["12月28日","肯尼迪航天中心","<b>在KSC看</b>","在海边待到晚上"],
      ["12月29日","环球影城","跳过","在冒险岛看"],
      ["12月30日","魔法王国","跳过","在园区里看，烟花之前"],
      ["12月31日","史诗宇宙","跳过","在天体公园看"],

    ],
    spotsTitle: "在哪里看",
    spots: [
      ["肯尼迪航天中心游客中心","最近的公共观看点 · 收费","很多发射凭普通门票就能在主园区观看，有现场解说。部分发射KSC会加卖发射交通票，坐车到NASA园区内更近的观看区。详见KSC活动日历。"],
      ["泰特斯维尔太空观景公园","免费 · 与KSC隔河相望","经典的公共观看点，隔着印第安河正对发射台，还有太空纪念碑。大型发射时人很多，要早到。"],
      ["麦克斯·布鲁尔大桥 / 泰特斯维尔滨水区","免费 · 靠近太空观景公园","可以清楚看到39A发射台和卡纳维拉尔角。在堤道旁或滨水公园停车。"],
      ["卡纳维拉尔港杰蒂公园","少量停车费 · 卡纳维拉尔角南边","海滩和码头离40号和41号发射台很近，大部分猎鹰9号和火神火箭都从这里发射。"],
      ["普拉亚林达海滩","国家海岸收费 · 离39A最近的海滩","离肯尼迪的发射台很近，但发射日常常出于安全原因关闭。开车前先确认。"],
      ["在奥兰多","免费 · 内陆约80公里","夜间和黄昏的发射很容易看到：点火后约30–60秒，东边会升起一个亮点。停车楼楼顶或朝东开阔的地方最好。"],
    ],
    howTitle: "发射日是怎样的",
    how: [
      "发射时间由轨道决定，不是为了方便观看——很多SpaceX发射在清晨或深夜。",
      "发射常常因为天气、危险区有船只或技术问题推迟几分钟、几小时甚至几天（称为“scrub”）。准备一个备选日。",
      "提前两三天时间通常就确定了。当天早上，看SpaceX或发射方的直播确认倒计时状态。",

    ],
    linksTitle: "实时发射时间表",
    footer: "实时发射数据来自<a href=\"https://thespacedevs.com/llapi\">The Space Devs的Launch Library 2</a>；时间为美东时间。日期和时间经常变动——开车去海边之前，请在发射方官网确认。",
  },
};

const LINKS = [
  ["Kennedy Space Center — launch calendar","https://www.kennedyspacecenter.com/launches-and-events/events-calendar/"],
  ["RocketLaunch.live — Florida","https://www.rocketlaunch.live/?filter=florida"],
  ["Next Spaceflight","https://nextspaceflight.com/launches/"],
  ["SpaceX launches","https://www.spacex.com/launches/"],
  ["Florida Today — space","https://www.floridatoday.com/space/"],
];

const LANG_KEY = "orlando-trip-lang";
let lang = "en";
let launches = null, live = false, fetchedAt = null, loadState = "loading";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function detectLang() {
  if (location.hash === "#zh" || location.hash === "#en") {
    const l = location.hash.slice(1);
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    return l;
  }
  try { const s = localStorage.getItem(LANG_KEY); if (s === "zh" || s === "en") return s; } catch (e) {}
  const langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
  return langs.some(l => /^zh\b/i.test(l)) ? "zh" : "en";
}

function normalize(x) {
  return {
    net: x.net, precId: x.net_precision?.id ?? 14, precName: x.net_precision?.name || "Year",
    status: x.status?.abbrev || "TBD", rocket: x.rocket?.configuration?.full_name || (x.name || "").split(" | ")[0],
    mission: x.mission?.name || (x.name || "").split(" | ")[1] || x.name, pad: x.pad?.name || "",
    loc: x.pad?.location?.name || "", provider: x.launch_service_provider?.name || "",
    ws: x.window_start, we: x.window_end,
  };
}

const etParts = iso => {
  const d = new Date(iso);
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: TZ, year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23", weekday:"short" }).formatToParts(d).map(o => [o.type, o.value]));
  return { ymd: `${p.year}-${p.month}-${p.day}`, h: Number(p.hour), m: Number(p.minute), wd: p.weekday };
};
const fmtTime = iso => new Intl.DateTimeFormat(lang === "zh" ? "zh-CN" : "en-US", { timeZone: TZ, hour:"numeric", minute:"2-digit" }).format(new Date(iso));
const fmtDay = iso => new Intl.DateTimeFormat(lang === "zh" ? "zh-CN" : "en-US", { timeZone: TZ, weekday:"short" }).format(new Date(iso));
const fmtMon = iso => new Intl.DateTimeFormat(lang === "zh" ? "zh-CN" : "en-US", { timeZone: TZ, month:"short" }).format(new Date(iso));
const fmtMonthYear = iso => new Intl.DateTimeFormat(lang === "zh" ? "zh-CN" : "en-US", { timeZone: "UTC", month:"long", year:"numeric" }).format(new Date(iso));

function light(iso) {
  const { h, m } = etParts(iso); const t = h + m / 60;
  // Late-December Orlando: sunrise ~7:15, sunset ~5:35 p.m. ET
  if ((t >= 17.4 && t <= 19.0) || (t >= 5.6 && t <= 7.3)) return "twilight";
  if (t > 19.0 || t < 5.6) return "night";
  return "day";
}

function renderLaunches() {
  const t = UI[lang];
  const all = launches || [];
  const firm = all.filter(l => l.precId <= 5);
  const inTrip = firm.filter(l => { const d = etParts(l.net).ymd; return d >= TRIP_START && d <= TRIP_END; });
  const vague = all.filter(l => l.precId > 5);

  if (loadState === "loading") { $("status").hidden = false; $("status").textContent = t.loading; }
  else if (!live) { $("status").hidden = false; $("status").textContent = t.liveFail; }
  else if (!inTrip.length) { $("status").hidden = false; $("status").textContent = t.noneYet; }
  else { $("status").hidden = true; }
  $("updated").textContent = live && fetchedAt ? t.updated(new Intl.DateTimeFormat(lang === "zh" ? "zh-CN" : "en-US", { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }).format(fetchedAt)) : (loadState === "loading" ? "" : t.snapshotLabel);

  $("trip-list").innerHTML = inTrip.map(l => {
    const p = etParts(l.net), lt = light(l.net), plan = PLAN[p.ymd];
    const st = l.status === "Go" ? "go" : (l.status === "Hold" ? "hold" : "tbd");
    const win = l.ws && l.we && l.ws !== l.we ? t.window(fmtTime(l.ws), fmtTime(l.we)) : "";
    return `<li class="launch">
      <div class="when"><span>${esc(fmtDay(l.net))}</span><span class="dd">${Number(p.ymd.slice(8))}</span><span>${esc(fmtMon(l.net))}</span><span class="tm">${l.precId <= 2 ? esc(fmtTime(l.net)) + " " + t.et : ""}</span></div>
      <div class="lbody">
        <h3>${esc(l.mission)}</h3>
        <span class="lsub">${esc(l.rocket)}${l.provider ? " · " + esc(l.provider) : ""} · ${esc(l.pad)}, ${esc(l.loc.replace(", FL, USA", ""))}</span>
        <div class="pills"><span class="pill ${st}">${esc(t.status[l.status] || l.status)}</span>${l.precId <= 2 ? `<span class="pill ${lt === "day" ? "tbd" : "night"}">${t[lt]}</span>` : ""}</div>
        ${win ? `<span class="lsub">${esc(win)}</span>` : ""}
        ${plan ? `<span class="plannote">${esc(t.planNote[plan])}</span>` : ""}
      </div>
    </li>`;
  }).join("");

  const seen = new Set();
  $("vague-list").innerHTML = vague.filter(l => { const k = l.mission + l.rocket; if (seen.has(k)) return false; seen.add(k); return true; })
    .map(l => `<li><span><b>${esc(l.mission)}</b> · ${esc(l.rocket)}</span><span class="vt">${esc(t.vagueWhen(l.precName, fmtMonthYear(l.net)))}</span><span class="vs">${esc(l.provider)} · ${esc(l.pad)}, ${esc(l.loc.replace(", FL, USA", ""))}</span></li>`).join("");
}

function renderStatic() {
  const t = UI[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = t.docTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t[el.dataset.i18nAria]));
  $("lang-toggle").textContent = t.toggle; $("lang-toggle").setAttribute("aria-label", t.toggleAria);
  [["nav-itin","index.html"],["nav-parks","parks.html"],["nav-launch","launches.html"],["nav-budget","budget.html"],["nav-vegas","vegas/index.html"]].forEach(([id, f]) => { $(id).href = `${f}#${lang}`; });
  $("plan-rows").innerHTML = t.rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("");
  $("spots").innerHTML = t.spots.map(([n, k, d]) => `<div class="spot"><h3>${esc(n)}</h3><span class="k">${esc(k)}</span><p>${esc(d)}</p></div>`).join("");
  $("how").innerHTML = t.how.map(x => `<li>${esc(x)}</li>`).join("");
  $("links").innerHTML = LINKS.map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join("");
}

function render() { renderStatic(); renderLaunches(); }

async function load() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (c && Date.now() - c.t < CACHE_MS && Array.isArray(c.data)) {
      launches = c.data; live = true; fetchedAt = new Date(c.t); loadState = "done"; renderLaunches(); return;
    }
  } catch (e) {}
  try {
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 12000);
    const r = await fetch(API, { signal: ctrl.signal }); clearTimeout(timer);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    launches = (j.results || []).map(normalize); live = true; fetchedAt = new Date();
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data: launches })); } catch (e) {}
  } catch (e) {
    launches = SNAPSHOT; live = false;
  }
  loadState = "done";
  renderLaunches();
}

$("lang-toggle").addEventListener("click", () => {
  lang = lang === "en" ? "zh" : "en";
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  render();
});
window.addEventListener("hashchange", () => { if (location.hash === "#zh" || location.hash === "#en") { lang = location.hash.slice(1); render(); } });

lang = detectLang();
launches = SNAPSHOT; // show the snapshot immediately while the live list loads
render();
load();
</script>
</body>

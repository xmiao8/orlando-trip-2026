<style>
/* Layout: one reading column — trip header, 11-day color strip, day-by-day list with filters, then dates + checklist side by side */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --ink: #15213a;
  --muted: #5b6678;
  --line: #dce1ea;
  --accent: #e2622a;
  --disney: #2c5bcc;
  --universal: #7b3dc2;
  --space: #e2622a;
  --rest: #2f8a58;
  --travel: #7d8798;
  --gold: #b8860b;
  --gold-bg: #fbf3dc;
  --on-cat: #ffffff;
  --display: "Bricolage Grotesque", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131e; --surface: #161d2c; --ink: #e8ecf3; --muted: #9ba5b7; --line: #263048;
    --accent: #ff8a52; --disney: #7fa3ff; --universal: #bb8ef2; --space: #ff8a52; --rest: #6cc795;
    --travel: #8e98aa; --gold: #f0c45a; --gold-bg: #2d2714; --on-cat: #0e131e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131e; --surface: #161d2c; --ink: #e8ecf3; --muted: #9ba5b7; --line: #263048;
  --accent: #ff8a52; --disney: #7fa3ff; --universal: #bb8ef2; --space: #ff8a52; --rest: #6cc795;
  --travel: #8e98aa; --gold: #f0c45a; --gold-bg: #2d2714; --on-cat: #0e131e; color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap {
  max-width: 900px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
  display: flex; flex-direction: column; gap: 40px;
}
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Header */
header { display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: clamp(34px, 7vw, 56px); font-weight: 800; line-height: 1.02; letter-spacing: -.02em; }
h1 span { color: var(--accent); }
.lede { max-width: 62ch; color: var(--muted); margin: 0; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 4px; font-size: 14px; }
.facts b { font-family: var(--display); font-size: 22px; font-weight: 800; margin-right: 6px; font-variant-numeric: tabular-nums; }
.facts .d b { color: var(--disney); } .facts .u b { color: var(--universal); }
.facts .s b { color: var(--space); } .facts .r b { color: var(--rest); }

/* Strip */
.strip { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.cell {
  appearance: none; border: 0; cursor: pointer; text-align: left;
  border-radius: 6px; padding: 8px 6px 7px; color: var(--on-cat); min-width: 0;
  display: flex; flex-direction: column; gap: 2px; font-family: var(--mono); font-size: 11px; line-height: 1.2;
}
.cell .n { font-family: var(--display); font-size: 18px; font-weight: 800; }
.cell .c { opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell:focus-visible, .chip:focus-visible, .check input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }
.cell.disney { background: var(--disney); } .cell.universal { background: var(--universal); }
.cell.space { background: var(--space); } .cell.rest { background: var(--rest); } .cell.travel { background: var(--travel); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Filters + days */
.days-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h2 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  appearance: none; font: 500 13px var(--body); color: var(--ink); cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.days { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; }
.day {
  display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 18px;
  padding: 18px 0; border-top: 1px solid var(--line); scroll-margin-top: 16px;
}
.day:last-child { border-bottom: 1px solid var(--line); }
.date { display: flex; flex-direction: column; font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.date .num { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1; color: var(--ink); letter-spacing: -.02em; margin: 2px 0; }
.body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.where { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.tag { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; border: 1px solid currentColor; }
.tag.disney { color: var(--disney); } .tag.universal { color: var(--universal); } .tag.space { color: var(--space); }
.tag.rest { color: var(--rest); } .tag.travel { color: var(--travel); }
.park { font-size: 14px; color: var(--muted); font-weight: 500; }
.iconic { font-size: 12px; font-weight: 600; color: var(--gold); background: var(--gold-bg); padding: 2px 8px; border-radius: 4px; }
h3 { font-size: 21px; font-weight: 600; line-height: 1.2; }
.day ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; max-width: 64ch; }
.note { font-size: 13.5px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; max-width: 64ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--mono); font-size: 12px; color: var(--muted); align-items: center; }
.crowd { display: inline-flex; align-items: center; gap: 6px; }
.bars { display: inline-flex; gap: 2px; align-items: end; }
.bars span { width: 5px; border-radius: 1px; background: var(--line); }
.bars span:nth-child(1){height:5px}.bars span:nth-child(2){height:7px}.bars span:nth-child(3){height:9px}.bars span:nth-child(4){height:11px}.bars span:nth-child(5){height:13px}
.bars span.on { background: var(--ink); }
.empty { color: var(--muted); padding: 18px 0; }



.toprow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.lang {
  appearance: none; cursor: pointer; font: 600 13px var(--body); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
}
.lang:hover { border-color: var(--muted); }
.lang:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
:lang(zh) h1 { letter-spacing: 0; }
:lang(zh) .eyebrow, :lang(zh) .tag, :lang(zh) .date { letter-spacing: .02em; }


.pnav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: -16px; }
.pnav a { font: 600 14px var(--body); color: var(--muted); text-decoration: none; padding: 8px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.pnav a:hover { color: var(--ink); }
.pnav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.pnav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Lower panels */
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 28px; }
.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2 { font-size: 21px; }
dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; font-size: 14px; }
dt { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 2px; white-space: nowrap; font-variant-numeric: tabular-nums; }
dd { margin: 0; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.check { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; padding: 7px 0; cursor: pointer; font-size: 14px; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.check .box { width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 4px; margin-top: 2px; display: grid; place-items: center; }
.check input:checked + .box { background: var(--rest); border-color: var(--rest); }
.check input:checked + .box::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.check input:checked ~ .txt { color: var(--muted); text-decoration: line-through; }
.check small { display: block; color: var(--muted); font-size: 12.5px; text-decoration: none; }
.progress { font-family: var(--mono); font-size: 12px; color: var(--muted); }
footer { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; max-width: 70ch; }

@media (max-width: 620px) {
  .strip { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .day { grid-template-columns: 58px minmax(0, 1fr); gap: 12px; }
  .date .num { font-size: 28px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>

const CHECKS = [
  { id:"flights", en:["Flights: New York and Madison → Orlando","In Dec 23, out Jan 1 (afternoon)"], zh:["机票：纽约和麦迪逊 → 奥兰多","12月23日去，1月1日下午回"] },
  { id:"lodging", en:["Hotel or rental for 9 nights","Dec 23 – Jan 1, split three ways"], zh:["酒店或民宿，共9晚","12月23日 – 1月1日，三人平摊"] },
  { id:"disney", en:["Disney 4-day tickets + park reservations","Start Dec 24, use any 4 days through Dec 30; about $742 at Undercover Tourist"], zh:["迪士尼4日门票 + 园区预约","12月24日起，到30日前任选4天；Undercover Tourist约$742"] },
  { id:"universal", en:["Universal 2-day ticket: park-to-park + Epic Universe","For Dec 29 and Dec 31; about $443 at Undercover Tourist"], zh:["环球影城2日票：园区互通 + 史诗宇宙","用于12月29日和31日；Undercover Tourist约$443"] },
  { id:"ll", en:["Lightning Lanes for Dec 24 and Dec 30","The two busiest Disney days on the plan"], zh:["12月24日和30日的闪电通道","计划中迪士尼最拥挤的两天"] },
  { id:"ksc", en:["Kennedy Space Center tickets","Buy from kennedyspacecenter.com ($77 + tax); check launches in early December"], zh:["肯尼迪航天中心门票","在官网购买（$77加税）；12月初查看火箭发射时间表"] },
  { id:"car", en:["Rental car","Needed for KSC, Universal and Blue Spring"], zh:["租车","去肯尼迪航天中心和蓝泉都需要"] },
  { id:"candle", en:["Candlelight dining package","Usually sold out; watch for cancellations"], zh:["烛光游行晚餐套餐","通常已售罄；留意有人退订"] },
];

const DOW = { en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], zh:["周日","周一","周二","周三","周四","周五","周六"] };
const MON = { en:{12:"Dec",1:"Jan"}, zh:{12:"12月",1:"1月"} };
const offCats = ["rest","travel"];
const LANG_KEY = "orlando-trip-lang";
const CHECK_KEY = "orlando-trip-checks";
let lang = "en";
let filter = "all";
let saved = {};
try { saved = JSON.parse(localStorage.getItem(CHECK_KEY) || "{}") || {}; } catch (e) { saved = {}; }

function detectLang() {
  if (location.hash === "#zh" || location.hash === "#en") {
    const l = location.hash.slice(1);
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    return l;
  }
  try { const s = localStorage.getItem(LANG_KEY); if (s === "zh" || s === "en") return s; } catch (e) {}
  const langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
  return langs.some(l => /^zh\b/i.test(l)) ? "zh" : "en";
}

function render() {
  const t = UI[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = t.docTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t[el.dataset.i18nAria]); });
  const tog = document.getElementById("lang-toggle");
  tog.textContent = t.toggle; tog.setAttribute("aria-label", t.toggleAria);
  document.getElementById("nav-itin").href = "index.html#" + lang;
  document.getElementById("nav-budget").href = "budget.html#" + lang;

  const strip = document.getElementById("strip");
  const list = document.getElementById("days");
  strip.innerHTML = ""; list.innerHTML = "";
  DAYS.forEach(day => {
    const c = day[lang], dow = DOW[lang][day.w], mon = MON[lang][day.m];
    const b = document.createElement("button");
    b.className = "cell " + day.cat; b.type = "button";
    b.setAttribute("aria-label", `${dow} ${mon} ${day.d}: ${c.title}`);
    b.innerHTML = `<span>${dow}</span><span class="n">${day.d}</span><span class="c">${c.tag}</span>`;
    b.addEventListener("click", () => { setFilter("all"); document.getElementById(day.id).scrollIntoView({ block: "start" }); });
    strip.appendChild(b);

    const li = document.createElement("li");
    li.className = "day"; li.id = day.id; li.dataset.cat = day.cat;
    const bars = day.crowd ? `<div class="meta"><span class="crowd">${t.crowds} <span class="bars" role="img" aria-label="${t.crowdAria(day.crowd)}">${[1,2,3,4,5].map(i => `<span class="${i <= day.crowd ? "on" : ""}"></span>`).join("")}</span></span></div>` : "";
    li.innerHTML = `
      <div class="date"><span>${dow}</span><span class="num">${day.d}</span><span>${mon}</span></div>
      <div class="body">
        <div class="where"><span class="tag ${day.cat}">${c.tag}</span><span class="park">${c.park}</span>${c.iconic ? `<span class="iconic">★ ${c.iconic}</span>` : ""}</div>
        <h3>${c.title}</h3>
        <ul>${c.items.map(i => `<li>${i}</li>`).join("")}</ul>
        ${c.note ? `<div class="note">${c.note}</div>` : ""}
        ${bars}
      </div>`;
    list.appendChild(li);
  });
  const empty = document.createElement("li");
  empty.className = "empty"; empty.id = "empty"; empty.textContent = t.empty;
  list.appendChild(empty);
  setFilter(filter);

  document.getElementById("dates").innerHTML = t.dates.map(([d, txt]) => `<dt>${d}</dt><dd>${txt}</dd>`).join("");

  const checksEl = document.getElementById("checks");
  checksEl.innerHTML = "";
  CHECKS.forEach(item => {
    const [label, sub] = item[lang];
    const li = document.createElement("li");
    li.innerHTML = `<label class="check" for="chk-${item.id}"><input type="checkbox" id="chk-${item.id}" ${saved[item.id] ? "checked" : ""}><span class="box" aria-hidden="true"></span><span class="txt">${label}<small>${sub}</small></span></label>`;
    li.querySelector("input").addEventListener("change", e => {
      saved[item.id] = e.target.checked;
      try { localStorage.setItem(CHECK_KEY, JSON.stringify(saved)); } catch (err) {}
      updateProgress();
    });
    checksEl.appendChild(li);
  });
  updateProgress();
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.f === f)));
  let shown = 0;
  document.querySelectorAll(".day").forEach(li => {
    const cat = li.dataset.cat;
    const match = f === "all" || (f === "off" ? offCats.includes(cat) : cat === f);
    li.hidden = !match; if (match) shown++;
  });
  const empty = document.getElementById("empty");
  if (empty) empty.hidden = shown > 0;
}

function updateProgress() {
  const done = CHECKS.filter(c => saved[c.id]).length;
  document.getElementById("progress").textContent = UI[lang].progress(done, CHECKS.length);
}

document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => setFilter(c.dataset.f)));
document.getElementById("lang-toggle").addEventListener("click", () => {
  lang = lang === "en" ? "zh" : "en";
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  render();
});
window.addEventListener("hashchange", () => {
  if (location.hash === "#zh" || location.hash === "#en") { lang = location.hash.slice(1); render(); }
});

lang = detectLang();
render();
</script>
